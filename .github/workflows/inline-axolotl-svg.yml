name: Inline axolotl SVG
on:
  push:
    paths:
      - '.github/workflows/inline-axolotl-svg.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken image asset with inline SVG
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 --decode | python
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Inline axolotl mascot and deepen hot pink"
          git push
