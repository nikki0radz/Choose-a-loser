name: Patch mobile bubbles and axolotl animation
on:
  push:
    paths:
      - '.github/workflows/mobile-bubbles-axo-animation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI and mascot
        env:
          CSS_B64: 
          JS_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re,base64
          p=Path('index.html')
          s=p.read_text()
          css=base64.b64decode(os.environ['CSS_B64']).decode()
          js=base64.b64decode(os.environ['JS_B64']).decode()
          if '/* Bubble-mode refresh + mobile fixes */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          s,n=re.subn(r"function axo\(level=1,expression='normal'\)\{.*?\nfunction startProven",js,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Could not replace axolotl block')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh bubbles, mobile layout and animate axolotl face"
          git push
