{q:'Which instrument usually has black and white keys?',c:['Piano','Violin','Trumpet'],a:0},
{q:'Which is the tallest animal?',c:['Giraffe','Elephant','Camel'],a:0},
{q:'What do bees make?',c:['Honey','Milk','Silk'],a:0},
{q:'Which metal is attracted strongly to a magnet?',c:['Iron','Gold','Silver'],a:0},
{q:'Which body part do you mainly use to smell?',c:['Nose','Ear','Elbow'],a:0},
{q:'Which season comes after spring?',c:['Summer','Autumn','Winter'],a:0},
{q:'How many months are in a year?',c:['12','10','14'],a:0},
{q:'Which ocean lies between Africa and Australia?',c:['Indian Ocean','Atlantic Ocean','Arctic Ocean'],a:0},
{q:'Which city is famous for the Eiffel Tower?',c:['Paris','Berlin','Vienna'],a:0},
{q:'Which bird is often associated with delivering babies in stories?',c:['Stork','Penguin','Owl'],a:0},
{q:'Which is the fastest land animal?',c:['Cheetah','Horse','Lion'],a:0},
{q:'What is the name of the fairy-tale girl with very long hair?',c:['Rapunzel','Cinderella','Belle'],a:0},
{q:'Which drink is made from roasted coffee beans?',c:['Coffee','Tea','Cocoa'],a:0},
{q:'Which animal has black-and-white stripes?',c:['Zebra','Tiger','Leopard'],a:0},
{q:'Which month has the fewest days?',c:['February','April','June'],a:0},
