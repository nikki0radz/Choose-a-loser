];"""
          ns,n=re.subn(r"const GATES=\[.*?\];\nconst INSULTS=",gates+"\nconst INSULTS=",s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Could not locate GATES block')
          p.write_text(ns)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Expand edit permission trivia bank"
          git push
