name: Expand edit trivia bank
on:
  push:
    paths:
      - '.github/workflows/expand-edit-trivia.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand edit-permission trivia bank
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          gates="""const GATES=[
{q:'Which animal is the largest land animal?',c:['Elephant','Giraffe','Rhino'],a:0},
{q:'What colour do you get by mixing blue and yellow?',c:['Green','Purple','Orange'],a:0},
{q:'What is the capital of France?',c:['Paris','Rome','Madrid'],a:0},
{q:'Which language is mainly spoken in Brazil?',c:['Portuguese','Spanish','French'],a:0},
{q:'Which planet is closest to the Sun?',c:['Mercury','Venus','Earth'],a:0},
{q:'How many days are in a leap year?',c:['366','365','364'],a:0},
{q:'Which animal is famous for changing colour to camouflage?',c:['Chameleon','Otter','Panda'],a:0},
{q:'Which country is shaped a bit like a boot?',c:['Italy','Portugal','Greece'],a:0},
