name: Expand edit trivia bank
on:
  push:
    paths:
      - '.github/workflows/expand-edit-trivia.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand edit-permission trivia bank
        env:
          GATES_B64: 
        run: |
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          gates=base64.b64decode(os.environ['GATES_B64']).decode()
          ns,n=re.subn(r"const GATES=\[.*?\];\nconst INSULTS=",gates+"\nconst INSULTS=",s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Could not locate GATES block')
          p.write_text(ns)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Expand edit permission trivia bank"
          git push
