{q:'Which letter comes immediately after Q in the alphabet?',c:['R','P','S'],a:0},
{q:'Which is heavier: 1 kg of feathers or 1 kg of bricks?',c:['They weigh the same','Bricks','Feathers'],a:0},
{q:'Which day comes after Friday?',c:['Saturday','Thursday','Sunday'],a:0},
{q:'True or false: Penguins can fly.',c:['True','False'],a:1},
{q:'True or false: A spider has eight legs.',c:['True','False'],a:0},
{q:'True or false: The Moon produces its own light.',c:['True','False'],a:1},
{q:'True or false: Dolphins are mammals.',c:['True','False'],a:0},
