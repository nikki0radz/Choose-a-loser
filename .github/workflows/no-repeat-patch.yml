name: Patch no-repeat questions
on:
  push:
    paths:
      - '.github/workflows/no-repeat-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function clone(x){return JSON.parse(JSON.stringify(x))} function rand(a){return a[Math.floor(Math.random()*a.length)]}"
          new="function clone(x){return JSON.parse(JSON.stringify(x))} function rand(a){return a[Math.floor(Math.random()*a.length)]} function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out} function drawQuestion(mode){const pool=available(data[mode]);if(!pool.length)return null;const sig=JSON.stringify(pool.map(q=>[q.text,q.chaos||1,q.answer||'',q.explain||'']));const key='chooseLoserBag_'+mode+'_'+chaos;let state;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch{state=null}if(!state||state.sig!==sig||!Array.isArray(state.queue)){state={sig,queue:shuffle(pool.map((_,i)=>i)),last:null}}if(!state.queue.length){state.queue=shuffle(pool.map((_,i)=>i));if(pool.length>1&&state.last!==null&&state.queue[state.queue.length-1]===state.last){const swapIndex=state.queue.findIndex(i=>i!==state.last);if(swapIndex>=0){[state.queue[swapIndex],state.queue[state.queue.length-1]]=[state.queue[state.queue.length-1],state.queue[swapIndex]]}}}const idx=state.queue.pop();state.last=idx;localStorage.setItem(key,JSON.stringify(state));return pool[idx]}"
          s=s.replace(old,new,1)
          s=s.replace("const q=rand(available(data.proven));","const q=drawQuestion('proven');if(!q){showScreen('homeScreen');return}",1)
          s=s.replace("const q=rand(available(data.debate));","const q=drawQuestion('debate');if(!q){showScreen('homeScreen');return}",1)
          old_ko="function beginKnockout(){remainingPlayers=playerCount;koUsed=[];nextKoQuestion()}function koPool(){const pool=available(data.knockout);let unused=pool.filter((_,i)=>!koUsed.includes(i));if(!unused.length){koUsed=[];unused=pool}return {pool,unused}}function nextKoQuestion(){if(remainingPlayers<=1){finishKnockout();return}randomLoading(()=>{const pool=available(data.knockout);const candidates=pool.map((q,i)=>({q,i})).filter(x=>!koUsed.includes(x.i));const pick=rand(candidates.length?candidates:pool.map((q,i)=>({q,i})));if(!candidates.length)koUsed=[];koUsed.push(pick.i);koCurrent=pick.q;"
          new_ko="function beginKnockout(){remainingPlayers=playerCount;nextKoQuestion()}function nextKoQuestion(){if(remainingPlayers<=1){finishKnockout();return}randomLoading(()=>{koCurrent=drawQuestion('knockout');if(!koCurrent){showScreen('homeScreen');return}"
          s=s.replace(old_ko,new_ko,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Prevent question repeats until deck cycles"
          git push
