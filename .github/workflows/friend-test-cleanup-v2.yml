name: Friend test cleanup v2
on:
  push:
    paths:
      - '.github/workflows/friend-test-cleanup-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore simple evil axolotl and improve knockout skip flow
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 --decode | python
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore simple evil axolotl and add knockout next button"
          git push
