name: Fix axolotl URL and hot pink
on:
  push:
    paths:
      - '.github/workflows/fix-axo-url-hot-pink.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken mascot URL and deepen pink
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 --decode | python
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix axolotl asset URL and make Anything Goes hotter pink"
          git push
