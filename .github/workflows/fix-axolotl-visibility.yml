name: Fix axolotl visibility and pink
on:
  push:
    paths:
      - '.github/workflows/fix-axolotl-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mascot sizing and Anything Goes colour
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''
/* Mascot visibility + Anything Goes colour fix */
.axowrap > div,
#loadingAxo,
#homeAxo,
#resultAxo,
#debateAxo,
#debateDoneAxo,
#koSetupAxo,
#loserAxo,
#gateAxo{width:100%;height:100%;display:block}
.axoFaceStage{width:100%;height:100%}
.axoFaceImg{width:100%;height:100%;max-height:none;object-fit:contain}
.proof{background:radial-gradient(circle at 23% 15%,rgba(255,255,255,.22),transparent 28%),linear-gradient(135deg,rgba(245,142,184,.74),rgba(211,103,149,.54))}
'''
          if '/* Mascot visibility + Anything Goes colour fix */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix axolotl visibility and Anything Goes pink"
          git push
