name: Fix axolotl visibility and pink
on:
  push:
    paths:
      - '.github/workflows/fix-axolotl-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force mascot asset and hotter pink
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 --decode | python
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Force axolotl asset and hotter Anything Goes pink"
          git push
